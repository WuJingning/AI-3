services:
  workbench:
    build: .
    image: contract-review-workbench:latest
    container_name: contract-review-workbench
    restart: unless-stopped
    # 服务器上单独放置 .env（含访问密钥），不要提交到代码仓库
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      # 正式环境建议关闭第三方一次性临时链接，改用扣子文件直传
      ALLOW_TEMP_LINK: "false"
    # 默认直接对外提供访问（http://服务器IP:8787）。
    # 如果前面要放 Nginx / Caddy 做 HTTPS 反代，把下面这行改成
    #   - "127.0.0.1:8787:8787"
    # 让端口只对本机可见即可。
    ports:
      - "8787:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
