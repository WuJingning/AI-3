# Fly.io 配置：fly launch --no-deploy 或直接 fly deploy 即可
# 访问密钥用命令写入，不要写进本文件：
#   fly secrets set COZE_API_TOKEN=你的密钥 COZE_WORKFLOW_ID=7684698570696376330
app = "contract-review-workbench"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  COZE_API_BASE = "https://api.coze.cn"
  ALLOW_TEMP_LINK = "false"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
